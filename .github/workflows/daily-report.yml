name: Daily report

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 5:00 PM IST, Mon-Fri (after NSE close + data settle)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-writes

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build report and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFIT_GOAL: ${{ vars.PROFIT_GOAL }}
          CAPITAL: ${{ vars.CAPITAL }}
          INTRADAY_LEVERAGE: ${{ vars.INTRADAY_LEVERAGE }}
          POSITIONS_CSV: ${{ secrets.POSITIONS_CSV }}
        run: python run_daily.py
      - name: Save report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ state/
          git diff --cached --quiet || (git commit -m "Daily report $(date -u +%F)" && git pull --rebase && git push)
