name: Morning planner

on:
  schedule:
    - cron: "30 2 * * 1-5"   # 8:00 AM IST: ask for capital and profit goal, then answer replies live until ~9:25
  workflow_dispatch:
    inputs:
      ask:
        description: "Send the question first"
        type: boolean
        default: true
      listen:
        description: "Minutes to keep answering replies"
        type: number
        default: 15

permissions:
  contents: write

concurrency:
  group: planner

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ask and answer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTRADAY_LEVERAGE: ${{ vars.INTRADAY_LEVERAGE }}
        run: >-
          python run_planner.py
          ${{ (github.event_name == 'schedule' || inputs.ask) && '--ask' || '' }}
          --listen ${{ github.event_name == 'schedule' && '85' || inputs.listen }}
      - name: Save message offset
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/telegram.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Planner replies $(date -u +%FT%H%M)" && git pull --rebase && git push)
