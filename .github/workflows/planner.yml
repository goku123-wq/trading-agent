name: Morning planner

on:
  schedule:
    - cron: "30 2 * * 1-5"      # 8:00 AM IST: ask for capital and profit goal
    - cron: "*/5 2-3 * * 1-5"   # 7:30-9:25 AM IST: answer replies (GitHub may run these a few minutes late)
  workflow_dispatch:
    inputs:
      ask:
        description: "Send the question now (otherwise: answer replies)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: planner

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ask or answer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTRADAY_LEVERAGE: ${{ vars.INTRADAY_LEVERAGE }}
        run: python run_planner.py ${{ (github.event.schedule == '30 2 * * 1-5' || inputs.ask) && '--ask' || '' }}
      - name: Save message offset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/telegram.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Planner replies $(date -u +%FT%H%M)" && git pull --rebase && git push)
