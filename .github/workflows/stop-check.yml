name: Stop-loss check

on:
  # Started by the always-on Telegram bot (planner.yml) on its own IST clock; GitHub's cron ran hours late.
  workflow_dispatch:
    inputs:
      test:
        description: "Test on the last trading session (works when the market is closed)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-writes

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check stops and targets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_stops.py ${{ inputs.test && '--test' || '' }}
      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Stop alerts $(date -u +%FT%H%M)" && git pull --rebase && git push)
