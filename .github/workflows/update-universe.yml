name: Update stock lists

on:
  schedule:
    - cron: "0 3 * * 0"   # Sunday 8:30 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-writes

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update_universe.py
      - name: Save lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/largecap.txt config/midcap.txt
          git diff --cached --quiet || (git commit -m "Update Nifty 100 / Midcap 150 lists" && git pull --rebase && git push)
