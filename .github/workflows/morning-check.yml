name: 10 AM market check

on:
  # Started by the always-on Telegram bot (planner.yml) on its own IST clock; GitHub's cron ran hours late.
  workflow_dispatch:
    inputs:
      test:
        description: "Test on the last trading session (works when the market is closed)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-writes

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyse the open and send suggestions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFIT_GOAL: ${{ vars.PROFIT_GOAL }}
          CAPITAL: ${{ vars.CAPITAL }}
          INTRADAY_LEVERAGE: ${{ vars.INTRADAY_LEVERAGE }}
        run: python run_morning.py ${{ inputs.test && '--replay' || '' }}
      - name: Save ideas for the planner page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ideas.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "10 AM ideas $(date -u +%F)" && git pull --rebase && git push)
